name: Build

on:
  pull_request: {}
  push:
    branches:
      - '**'

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    
    services:
        mysql:
          image: mysql:8.0
          env:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: circle_erp_test
          ports:
            - 3306:3306
          options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CircleERP.sln

      - name: Build
        run: dotnet build CircleERP.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CircleERP.sln --configuration Release --no-build --verbosity normal

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CircleERP.client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CircleERP.client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
